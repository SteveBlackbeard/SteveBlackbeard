<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="320" viewBox="0 0 1100 320">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="100%" stop-color="#0E141C"/>
    </linearGradient>
    <linearGradient id="strokeC" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundC">
      <rect x="20" y="20" width="1060" height="280" rx="22" ry="22"/>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="20" y="20" width="1060" height="280" rx="22" ry="22" fill="url(#bgC)" stroke="url(#strokeC)" stroke-width="2"/>

  <!-- Soft inner glow frame -->
  <rect x="28" y="28" width="1044" height="264" rx="18" ry="18" fill="none" stroke="#00E5FF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Logo -->
  <image
    xlink:href="logo-chronolith.png"
    x="80" y="50" width="940" height="220"
    clip-path="url(#roundC)"
    filter="url(#glowC)"
    preserveAspectRatio="xMidYMid meet"/>
</svg>