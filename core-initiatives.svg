svg xmlns=httpwww.w3.org2000svg width=1100 height=420 viewBox=0 0 1100 420
  defs
    linearGradient id=bg x1=0 y1=0 x2=1 y2=1
      stop offset=0% stop-color=#0B0F14
      stop offset=100% stop-color=#121821
    linearGradient
    linearGradient id=header x1=0 y1=0 x2=1 y2=0
      stop offset=0% stop-color=#00E5FF stop-opacity=0.15
      stop offset=50% stop-color=#7C5CFF stop-opacity=0.12
      stop offset=100% stop-color=#00E5FF stop-opacity=0.15
    linearGradient
    linearGradient id=line x1=0 y1=0 x2=1 y2=0
      stop offset=0% stop-color=#00E5FF stop-opacity=0
      stop offset=50% stop-color=#00E5FF stop-opacity=0.7
      stop offset=100% stop-color=#00E5FF stop-opacity=0
    linearGradient
    filter id=glow x=-20% y=-20% width=140% height=140%
      feGaussianBlur stdDeviation=2 result=blur
      feMerge
        feMergeNode in=blur
        feMergeNode in=SourceGraphic
      feMerge
    filter
  defs

  !-- Card --
  rect x=20 y=20 width=1060 height=380 rx=18 fill=url(#bg) stroke=#1F2A36 stroke-width=2
  rect x=20 y=20 width=1060 height=64 rx=18 fill=url(#header)
  rect x=20 y=52 width=1060 height=32 fill=url(#header)

  !-- Title --
  text x=550 y=58 text-anchor=middle font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=22 font-weight=700 fill=#E8F1FF letter-spacing=1.5ETHERNIUM — CORE INITIATIVEStext
  rect x=180 y=72 width=740 height=1.5 fill=url(#line)

  !-- Column headers --
  text x=80 y=115 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=13 font-weight=700 fill=#7F93A8 letter-spacing=1.2INITIATIVEtext
  text x=360 y=115 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=13 font-weight=700 fill=#7F93A8 letter-spacing=1.2FOCUStext
  text x=700 y=115 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=13 font-weight=700 fill=#7F93A8 letter-spacing=1.2COREtext
  line x1=50 y1=128 x2=1050 y2=128 stroke=#243041 stroke-width=1

  !-- Row 1 --
  rect x=40 y=140 width=1020 height=48 rx=8 fill=#0F1620 opacity=0.9
  text x=80 y=170 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=16 font-weight=700 fill=#00E5FF filter=url(#glow)Chronolithtext
  text x=360 y=170 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=15 fill=#D5E2F0Long-running AI integritytext
  text x=700 y=170 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=14 fill=#A9B7C8Merkle · Ed25519 · Bitcoin anchortext

  !-- Row 2 --
  rect x=40 y=196 width=1020 height=48 rx=8 fill=#121A25 opacity=0.75
  text x=80 y=226 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=16 font-weight=700 fill=#00E5FF filter=url(#glow)Seneschaltext
  text x=360 y=226 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=15 fill=#D5E2F0AI cost &amp; securitytext
  text x=700 y=226 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=14 fill=#A9B7C8Token reduction · Prompt scanningtext

  !-- Row 3 --
  rect x=40 y=252 width=1020 height=48 rx=8 fill=#0F1620 opacity=0.9
  text x=80 y=282 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=16 font-weight=700 fill=#00E5FF filter=url(#glow)Fonts Forgetext
  text x=360 y=282 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=15 fill=#D5E2F0Custom typographytext
  text x=700 y=282 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=14 fill=#A9B7C8Raster → TTFWOFF · Watermarkingtext

  !-- Row 4 --
  rect x=40 y=308 width=1020 height=48 rx=8 fill=#121A25 opacity=0.75
  text x=80 y=338 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=16 font-weight=700 fill=#00E5FF filter=url(#glow)Interactive Labtext
  text x=360 y=338 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=15 fill=#D5E2F0Scientific visualizationtext
  text x=700 y=338 font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=14 fill=#A9B7C8WebGL · B-DNA · IUPACtext

  !-- Footer --
  text x=550 y=380 text-anchor=middle font-family=Segoe UI, Helvetica, Arial, sans-serif font-size=12 fill=#6B7C8F letter-spacing=1NEMETH CORP · R&amp;Dtext
svg